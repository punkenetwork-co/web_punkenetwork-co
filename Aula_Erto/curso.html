<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso · Aula Virtual ERTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<nav data-navbar></nav>

<div class="curso-layout">
  <aside class="curso-side">
    <a href="panel-estudiante.html" class="btn btn-ghost btn-sm mb-2"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
    <h3 id="cursoTituloSide">Cargando...</h3>
    <ul class="curso-modulos" id="listaModulos"></ul>
  </aside>

  <main class="curso-main">
    <div id="contenidoCurso">
      <div class="text-center" style="padding:3rem 0;"><div class="loader-spin" style="margin:0 auto;"></div></div>
    </div>
  </main>
</div>

<footer data-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script>
let SESION = null, CURSO = null, MODULO_ACTIVO = 0;

(async function init() {
  SESION = await AUTH.protegerPagina('estudiante');
  if (!SESION) return;
  initLayout('panel');
  AUTH.bloquearInspeccion();

  const params = new URLSearchParams(window.location.search);
  const cursoId = params.get('id');
  if (!cursoId) { window.location.href = 'panel-estudiante.html'; return; }

  try {
    const r = await API.cursoContenido(SESION.token, cursoId);
    if (!r.success) throw new Error(r.message);
    CURSO = r.curso;
    document.getElementById('cursoTituloSide').textContent = CURSO.titulo;
    document.title = CURSO.titulo + ' · Aula Virtual ERTO';
    renderModulos();
    cargarModulo(0);
  } catch (e) {
    document.getElementById('contenidoCurso').innerHTML = '<div class="alert alert-error show"><i class="fa-solid fa-triangle-exclamation"></i><span>' + e.message + '</span></div>';
  }
})();

function renderModulos() {
  const mods = CURSO.modulos || [];
  document.getElementById('listaModulos').innerHTML = mods.map(function (m, i) {
    return '<li data-i="' + i + '" class="' + (i === 0 ? 'active' : '') + (m.completado ? ' completado' : '') + '" onclick="cargarModulo(' + i + ')">' +
      '<i class="fa-solid ' + (m.icono || 'fa-book') + '"></i> ' + esc(m.titulo) + '</li>';
  }).join('');
}

function cargarModulo(i) {
  MODULO_ACTIVO = i;
  const m = (CURSO.modulos || [])[i];
  if (!m) return;
  document.querySelectorAll('.curso-modulos li').forEach(function (li) {
    li.classList.toggle('active', Number(li.dataset.i) === i);
  });
  document.getElementById('contenidoCurso').innerHTML =
    '<div class="chip green mb-2"><i class="fa-solid fa-book-open"></i> ' + esc(CURSO.titulo) + '</div>' +
    '<h1>' + esc(m.titulo) + '</h1>' +
    '<div class="contenido">' + (m.contenido_html || '<p>Contenido en preparación.</p>') + '</div>' +
    '<div class="btn-row mt-3">' +
      (i > 0 ? '<button class="btn btn-ghost" onclick="cargarModulo(' + (i - 1) + ')"><i class="fa-solid fa-arrow-left"></i> Anterior</button>' : '<span></span>') +
      (i < (CURSO.modulos.length - 1)
        ? '<button class="btn btn-primary" onclick="cargarModulo(' + (i + 1) + ')">Siguiente <i class="fa-solid fa-arrow-right"></i></button>'
        : '<button class="btn btn-success" onclick="marcarCompletado()"><i class="fa-solid fa-circle-check"></i> Marcar como completado</button>') +
    '</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function marcarCompletado() {
  try {
    await API.marcarProgreso(SESION.token, CURSO.id, MODULO_ACTIVO, true);
    alert('¡Progreso guardado!');
  } catch (e) { alert('No se pudo guardar el progreso.'); }
}
</script>
</body>
</html>
