<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Aula Virtual ERTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div data-topbar></div>
<nav data-navbar></nav>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
        <h2>Recuperar contraseña</h2>
        <p>Te enviaremos instrucciones a tu correo</p>
      </div>

      <div class="alert" id="alertaRecuperar"></div>

      <form id="formRecuperar" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-icon"><i class="fa-solid fa-envelope prefix"></i>
            <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="form-error" id="err-email"><i class="fa-solid fa-circle-exclamation"></i> Ingresa un correo válido.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnRecuperar">
          <i class="fa-solid fa-paper-plane"></i> Enviar instrucciones
        </button>
      </form>

      <div class="auth-foot"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión</a></div>
    </div>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script>
initLayout('recuperar');

document.getElementById('formRecuperar').addEventListener('submit', async function (e) {
  e.preventDefault();
  ocultarAlerta('alertaRecuperar');
  const emailEl = document.getElementById('email');
  const btn = document.getElementById('btnRecuperar');
  const vE = VALID.email(emailEl.value);
  marcarCampo(emailEl, vE);
  document.getElementById('err-email').classList.toggle('show', !vE);
  if (!vE) return;

  btnLoading(btn, true, 'Enviando...');
  try {
    await API.recuperar(emailEl.value.trim().toLowerCase());
    mostrarAlerta('alertaRecuperar', 'success',
      'Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña. Revisa tu bandeja de entrada y spam.');
    document.getElementById('formRecuperar').reset();
  } catch (err) {
    mostrarAlerta('alertaRecuperar', 'error', 'No se pudo procesar la solicitud. Intenta de nuevo.');
  } finally {
    btnLoading(btn, false);
  }
});
</script>
</body>
</html>
