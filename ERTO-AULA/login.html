<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · ERTO</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:linear-gradient(135deg,#0200AF,#01007a);min-height:100vh">

<div style="padding-top:40px;text-align:center">
  <a href="index.html" class="brand" style="color:#fff;justify-content:center;display:inline-flex">
    <img src="assets/img/logo/logo.png" alt="ERTO" onerror="this.style.display='none'">
    <span style="color:#fff">ERTO<span style="color:#00c2ff">.</span></span>
  </a>
</div>

<div class="form-card fade-in">
  <h2>Iniciar sesión</h2>
  <p class="sub">Accede a tu Aula Virtual ERTO</p>

  <form id="formLogin" novalidate>
    <div class="field" id="fEmail">
      <label><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
      <input type="email" name="email" required placeholder="tu@email.com" autocomplete="email">
      <div class="error">Ingresa un correo válido</div>
    </div>
    <div class="field" id="fPass">
      <label><i class="fa-solid fa-lock"></i> Contraseña</label>
      <input type="password" name="password" required placeholder="Mínimo 8 caracteres" autocomplete="current-password">
      <div class="error">Contraseña obligatoria</div>
    </div>
    <button type="submit" class="btn btn-primary btn-full btn-lg" id="btnLogin">
      <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
    </button>
  </form>

  <div style="text-align:center;margin-top:22px;font-size:.9rem;color:var(--erto-gray)">
    <a href="recuperar.html" style="color:var(--erto-primary)">¿Olvidaste tu contraseña?</a><br><br>
    ¿No tienes cuenta? <a href="registro.html" style="color:var(--erto-primary);font-weight:600">Regístrate</a>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script>
const form = document.getElementById('formLogin');
const btn  = document.getElementById('btnLogin');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = form.email.value.trim();
  const password = form.password.value;

  const fE = document.getElementById('fEmail');
  const fP = document.getElementById('fPass');
  fE.classList.remove('invalid'); fP.classList.remove('invalid');
  let valido = true;

  if (!validarEmail(email)) { fE.classList.add('invalid'); valido = false; }
  if (!password) { fP.classList.add('invalid'); valido = false; }
  if (!valido) return;

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

  const r = await hacerLogin(email, password);

  if (!r.success) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión';
    alerta(r.message || 'No se pudo iniciar sesión', 'error');
  }
});
</script>
</body>
</html>
