<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Aula Virtual ERTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div data-topbar></div>
<nav data-navbar></nav>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
        <h2>Bienvenido de nuevo</h2>
        <p>Ingresa tus credenciales para acceder al aula virtual</p>
      </div>

      <div class="alert" id="alertaLogin"></div>

      <form id="formLogin" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-icon"><i class="fa-solid fa-envelope prefix"></i>
            <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="form-error" id="err-email"><i class="fa-solid fa-circle-exclamation"></i> Ingresa un correo válido.</div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-icon"><i class="fa-solid fa-lock prefix"></i>
            <input type="password" class="form-control" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('password', this)"></i>
          </div>
          <div class="form-error" id="err-password"><i class="fa-solid fa-circle-exclamation"></i> Ingresa tu contraseña.</div>
        </div>

        <div class="link-row">
          <label class="checkbox" style="margin:0;"><input type="checkbox" id="recordarme"><span>Recordarme</span></label>
          <a href="recuperar.html"><i class="fa-solid fa-key"></i> ¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLogin">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
        </button>
      </form>

      <div class="divider">¿Aún no tienes cuenta?</div>
      <a href="inscripcion.html" class="btn btn-outline btn-block">
        <i class="fa-solid fa-user-plus"></i> Inscribirme en un curso
      </a>
    </div>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script>
initLayout('login');

(async function () {
  if (await AUTH.validar()) {
    const s = AUTH.sesion();
    AUTH.redirigirPorRol(s.rol);
  }
})();

document.getElementById('formLogin').addEventListener('submit', async function (e) {
  e.preventDefault();
  ocultarAlerta('alertaLogin');
  const emailEl = document.getElementById('email'), passEl = document.getElementById('password');
  const btn = document.getElementById('btnLogin');
  const vE = VALID.email(emailEl.value), vP = passEl.value.length > 0;
  marcarCampo(emailEl, vE); marcarCampo(passEl, vP);
  document.getElementById('err-email').classList.toggle('show', !vE);
  document.getElementById('err-password').classList.toggle('show', !vP);
  if (!vE || !vP) return;

  btnLoading(btn, true, 'Verificando...');
  try {
    const r = await API.login(emailEl.value.trim().toLowerCase(), passEl.value);
    if (!r.success) throw new Error(r.message);
    AUTH.guardarSesion(r.usuario, r.token);
    mostrarAlerta('alertaLogin', 'success', '¡Bienvenido, ' + r.usuario.nombres + '! Redirigiendo...');
    setTimeout(function () { AUTH.redirigirPorRol(r.usuario.rol); }, 900);
  } catch (err) {
    mostrarAlerta('alertaLogin', 'error', err.message);
    btnLoading(btn, false);
    marcarCampo(passEl, false);
  }
});
</script>
</body>
</html>
