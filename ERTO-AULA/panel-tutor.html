<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Tutor · ERTO</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="header"></div>

<div class="container dashboard">
  <h1>Panel Tutor</h1>
  <p class="welcome">Gestión de estudiantes, exámenes y certificados</p>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="certificados"><i class="fa-solid fa-certificate"></i> Certificados</button>
    <button class="tab" data-tab="estudiantes"><i class="fa-solid fa-users"></i> Estudiantes</button>
    <button class="tab" data-tab="examenes"><i class="fa-solid fa-clipboard-check"></i> Exámenes</button>
  </div>

  <div class="tab-panel active" id="panel-certificados">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Código</th><th>Estudiante</th><th>Curso</th><th>Nota</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead>
        <tbody id="tablaCerts"><tr><td colspan="7">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="panel-estudiantes">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Documento</th><th>Estado</th></tr></thead>
        <tbody id="tablaEst"><tr><td colspan="4">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="panel-examenes">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuario</th><th>Curso</th><th>Aciertos</th><th>Nota</th><th>Fecha</th></tr></thead>
        <tbody id="tablaEx"><tr><td colspan="5">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script>
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

(async function init(){
  protegerPagina();
  const u = await requiereSesion(['tutor','admin']);
  if (!u) return;
  pintarHeader('header', 'Tutor', { texto:'Tutor', color:'warning' });

  const r = await API.listaCertificados();
  const certs = r.success ? r.certificados : [];

  document.getElementById('stats').innerHTML = `
    <div class="stat"><i class="fa-solid fa-users"></i><div class="value">${certs.length}</div><div class="label">Estudiantes certificados</div></div>
    <div class="stat"><i class="fa-solid fa-clipboard-check"></i><div class="value">${certs.length}</div><div class="label">Exámenes aprobados</div></div>
    <div class="stat"><i class="fa-solid fa-circle-check"></i><div class="value">${certs.filter(c=>c.enviado==='Enviado').length}</div><div class="label">Certificados enviados</div></div>
    <div class="stat"><i class="fa-solid fa-hourglass-half"></i><div class="value">${certs.filter(c=>c.enviado!=='Enviado').length}</div><div class="label">Pendientes</div></div>`;

  document.getElementById('tablaCerts').innerHTML = certs.length ? certs.map(c => `
    <tr>
      <td><code>${c.codigo}</code></td>
      <td>${c.nombre_completo}</td>
      <td>${c.curso_titulo || c.curso_id}</td>
      <td>${c.nota_final}%</td>
      <td>${formatearFecha(c.fecha_emision)}</td>
      <td><span class="badge badge-${c.enviado==='Enviado'?'success':'warning'}">${c.enviado}</span></td>
      <td>
        ${c.enviado !== 'Enviado'
          ? `<button class="btn btn-success btn-sm" onclick="marcar('${c.codigo}')"><i class="fa-solid fa-paper-plane"></i> Enviar</button>`
          : '<span class="badge badge-success"><i class="fa-solid fa-check"></i> Enviado</span>'}
      </td>
    </tr>`).join('') : '<tr><td colspan="7">Sin certificados aún</td></tr>';

  document.getElementById('tablaEst').innerHTML = '<tr><td colspan="4">Los estudiantes se muestran al aparecer en certificados</td></tr>';
  document.getElementById('tablaEx').innerHTML = '<tr><td colspan="5">Próximamente</td></tr>';
})();

async function marcar(codigo) {
  const r = await API.marcarEnviado(codigo);
  if (r.success) { alerta('Certificado marcado como enviado','success'); setTimeout(()=>location.reload(),800); }
  else alerta(r.message || 'Error','error');
}
</script>
</body>
</html>
