<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificado · ERTO</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header class="hero" style="padding:40px 0 50px">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
    <a href="panel-estudiante.html" class="btn btn-outline-white btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    <div style="display:flex;gap:10px">
      <button class="btn btn-white btn-sm" onclick="descargarPNG()"><i class="fa-solid fa-image"></i> PNG</button>
      <button class="btn btn-white btn-sm" onclick="descargarPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
    </div>
  </div>
</header>

<div class="cert-wrap">
  <div class="cert" id="certificado">
    <div class="cert-head">
      <img src="assets/img/logo/punke.png" alt="Punke" onerror="this.style.display='none'">
      <img src="assets/img/logo/logo.png" alt="ERTO" onerror="this.style.display='none'">
    </div>
    <h1>CERTIFICADO DE CONSTANCIA</h1>
    <p class="sub">ERTO · Punke Network</p>
    <p class="otorga">Se otorga el presente certificado a:</p>
    <div class="nombre" id="cNombre">—</div>
    <p class="doc">Documento: <span id="cDoc">—</span></p>
    <p class="otorga">Por haber completado satisfactoriamente el curso:</p>
    <p class="curso" id="cCurso">—</p>
    <p class="nota">Con una nota final de <strong id="cNota">—</strong></p>
    <div class="cert-foot">
      <div>
        <strong>Código:</strong> <span id="cCodigo">—</span><br>
        <strong>Fecha:</strong> <span id="cFecha">—</span>
      </div>
      <div class="firma">
        <div class="linea"></div>
        <strong>Dirección Académica</strong><br>ERTO · Punke Network
      </div>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script>
const codigo = getParam('codigo');

(async function(){
  protegerPagina();
  if (!codigo) return alerta('Código de certificado no válido','error');
  const r = await API.certificadoDetalle(codigo);
  if (!r.success || !r.certificado) return alerta('Certificado no encontrado','error');
  const c = r.certificado;
  document.getElementById('cNombre').textContent = c.nombre_completo || '—';
  document.getElementById('cDoc').textContent = c.numero_documento || '—';
  document.getElementById('cCurso').textContent = c.curso_titulo || ('Curso #' + c.curso_id);
  document.getElementById('cNota').textContent = c.nota_final + '%';
  document.getElementById('cCodigo').textContent = c.codigo;
  document.getElementById('cFecha').textContent = formatearFecha(c.fecha_emision);
})();

async function descargarPNG() {
  const el = document.getElementById('certificado');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#fff' });
  const link = document.createElement('a');
  link.download = `certificado-${codigo}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function descargarPDF() {
  const el = document.getElementById('certificado');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#fff' });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const w = pdf.internal.pageSize.getWidth();
  const h = pdf.internal.pageSize.getHeight();
  pdf.addImage(imgData, 'PNG', 10, 10, w-20, (w-20) * (canvas.height/canvas.width));
  pdf.save(`certificado-${codigo}.pdf`);
}
</script>
</body>
</html>
