<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación · Aula Virtual ERTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<nav data-navbar></nav>

<main>
  <div class="container container-mid" style="padding-top:2rem;padding-bottom:4rem;">
    <div class="card" id="tarjetaExamen">
      <div class="text-center" style="padding:2rem 0;">
        <div class="loader-spin" style="margin:0 auto;"></div>
      </div>
    </div>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script>
let SESION = null, PREGUNTAS = [], CURSO_ID = 0, RESPUESTAS = {};

async function init() {
  if (!(await AUTH.validar())) { window.location.href = 'login.html'; return; }
  SESION = AUTH.sesion();
  initLayout('panel');
  AUTH.bloquearInspeccion();

  const params = new URLSearchParams(location.search);
  CURSO_ID = params.get('id');
  if (!CURSO_ID) { window.location.href = 'panel-estudiante.html'; return; }

  try {
    const r = await API.examen(SESION.token, CURSO_ID);
    if (!r.success) {
      document.getElementById('tarjetaExamen').innerHTML =
        '<div class="alert alert-error show"><i class="fa-solid fa-triangle-exclamation"></i><span>' + r.message + '</span></div>' +
        '<div class="text-center mt-3"><a href="panel-estudiante.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a></div>';
      return;
    }
    PREGUNTAS = r.preguntas;
    renderExamen();
  } catch (e) {
    document.getElementById('tarjetaExamen').innerHTML =
      '<div class="alert alert-error show"><i class="fa-solid fa-triangle-exclamation"></i><span>' + e.message + '</span></div>';
  }
}

function renderExamen() {
  const total = PREGUNTAS.length;
  let html = '<div class="text-center mb-3">' +
    '<div class="auth-icon" style="margin:0 auto 1rem;"><i class="fa-solid fa-clipboard-check"></i></div>' +
    '<h1 style="font-size:1.6rem;font-weight:800;margin-bottom:.3rem;">Evaluación final</h1>' +
    '<p style="color:var(--text-light);font-size:.92rem;">' + total + ' preguntas · Necesitas 70% para aprobar</p>' +
    '</div>' +
    '<div class="alert" id="alertaExamen"></div>' +
    '<form id="formExamen">';

  PREGUNTAS.forEach(function (p, i) {
    html += '<div class="pregunta-bloque" style="margin-bottom:1.5rem;padding:1.2rem;background:#fafbff;border-radius:12px;border:1px solid var(--border);">' +
      '<div style="display:flex;gap:.7rem;margin-bottom:.8rem;">' +
        '<div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0;">' + (i + 1) + '</div>' +
        '<div style="font-weight:600;font-size:.95rem;">' + esc(p.pregunta) + '</div>' +
      '</div>';
    ['A','B','C','D'].forEach(function (k) {
      if (!p.opciones[k]) return;
      html += '<label style="display:flex;gap:.7rem;padding:.7rem .9rem;border-radius:10px;cursor:pointer;margin-bottom:.4rem;transition:0.2s;border:1.5px solid transparent;" ' +
        'onmouseover="this.style.background=\'#eef0ff\'" onmouseout="this.style.background=\'transparent\'">' +
        '<input type="radio" name="q' + p.id + '" value="' + k + '" style="accent-color:var(--primary);margin-top:.2rem;">' +
        '<span style="font-size:.9rem;"><strong>' + k + '.</strong> ' + esc(p.opciones[k]) + '</span>' +
      '</label>';
    });
    html += '</div>';
  });

  html += '<button type="submit" class="btn btn-primary btn-block btn-lg mt-3" id="btnEnviarExamen">' +
    '<i class="fa-solid fa-paper-plane"></i> Enviar respuestas</button>' +
    '</form>';

  document.getElementById('tarjetaExamen').innerHTML = html;
  document.getElementById('formExamen').addEventListener('submit', enviarExamen);
}

async function enviarExamen(e) {
  e.preventDefault();
  RESPUESTAS = {};
  let faltan = 0;

  PREGUNTAS.forEach(function (p) {
    const sel = document.querySelector('input[name="q' + p.id + '"]:checked');
    if (sel) RESPUESTAS[p.id] = sel.value;
    else faltan++;
  });

  if (faltan > 0) {
    mostrarAlerta('alertaExamen', 'error', 'Debes responder todas las preguntas. Faltan ' + faltan + '.');
    return;
  }

  const btn = document.getElementById('btnEnviarExamen');
  btnLoading(btn, true, 'Calificando...');

  try {
    const r = await API.enviarExamen(SESION.token, CURSO_ID, RESPUESTAS);
    if (!r.success) throw new Error(r.message);
    mostrarResultado(r);
  } catch (err) {
    mostrarAlerta('alertaExamen', 'error', err.message);
    btnLoading(btn, false);
  }
}

function mostrarResultado(r) {
  const aprobado = r.aprobado;
  const color = aprobado ? '#2ecc71' : '#e74c3c';
  const icono = aprobado ? 'fa-circle-check' : 'fa-circle-xmark';

  document.getElementById('tarjetaExamen').innerHTML =
    '<div class="text-center" style="padding:2rem 1rem;">' +
      '<div style="width:100px;height:100px;margin:0 auto 1.5rem;border-radius:50%;display:grid;place-items:center;background:' + color + '1a;color:' + color + ';font-size:3rem;">' +
        '<i class="fa-solid ' + icono + '"></i>' +
      '</div>' +
      '<h1 style="font-size:1.8rem;font-weight:800;margin-bottom:.5rem;">' + (aprobado ? '¡Felicidades!' : 'No aprobaste') + '</h1>' +
      '<p style="font-size:1.1rem;color:var(--text-light);margin-bottom:1rem;">' +
        'Obtuviste <strong style="color:' + color + ';font-size:1.4rem;">' + r.porcentaje + '%</strong>' +
      '</p>' +
      '<p style="color:var(--text-light);margin-bottom:2rem;">' +
        r.puntaje + ' de ' + r.puntaje_max + ' puntos · Mínimo requerido: ' + r.minimo + '%' +
      '</p>' +
      (aprobado
        ? '<a href="encuesta.html?id=' + CURSO_ID + '" class="btn btn-primary btn-lg"><i class="fa-solid fa-clipboard-list"></i> Continuar con la encuesta</a>'
        : '<div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;">' +
            '<a href="evaluacion.html?id=' + CURSO_ID + '" class="btn btn-primary"><i class="fa-solid fa-rotate-right"></i> Intentar de nuevo</a>' +
            '<a href="curso.html?id=' + CURSO_ID + '" class="btn btn-ghost"><i class="fa-solid fa-book-open"></i> Repasar el curso</a>' +
          '</div>'
      ) +
    '</div>';
}

init();
</script>
</body>
</html>
