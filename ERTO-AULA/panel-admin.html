<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin · ERTO</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="header"></div>

<div class="container dashboard">
  <h1>Panel Administrador</h1>
  <p class="welcome">Control total del sistema</p>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="usuarios"><i class="fa-solid fa-users-gear"></i> Usuarios</button>
    <button class="tab" data-tab="examenes"><i class="fa-solid fa-file-pen"></i> Exámenes</button>
    <button class="tab" data-tab="mensajes"><i class="fa-solid fa-envelope"></i> Mensajes</button>
    <button class="tab" data-tab="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i> Cotizaciones</button>
  </div>

  <div class="tab-panel active" id="panel-usuarios">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <input id="buscar" placeholder="Buscar por nombre o email..." style="flex:1;min-width:240px;padding:10px 14px;border:1.5px solid var(--erto-border);border-radius:8px">
      <select id="filtroRol" style="padding:10px 14px;border:1.5px solid var(--erto-border);border-radius:8px">
        <option value="">Todos los roles</option>
        <option value="estudiante">Estudiante</option>
        <option value="tutor">Tutor</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>Documento</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaUsuarios"><tr><td colspan="7">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="panel-examenes"><div class="card"><p>Módulo de exámenes disponible próximamente.</p></div></div>
  <div class="tab-panel" id="panel-mensajes"><div class="card"><p>Módulo de mensajes disponible próximamente.</p></div></div>
  <div class="tab-panel" id="panel-cotizaciones"><div class="card"><p>Módulo de cotizaciones disponible próximamente.</p></div></div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script>
let usuarios = [];

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

(async function init(){
  protegerPagina();
  const u = await requiereSesion(['admin']);
  if (!u) return;
  pintarHeader('header', 'Admin', { texto:'Administrador', color:'danger' });

  const r = await API.listaUsuarios();
  usuarios = r.success ? r.usuarios : [];
  renderStats(); renderTabla();

  document.getElementById('buscar').oninput = renderTabla;
  document.getElementById('filtroRol').onchange = renderTabla;
})();

function renderStats() {
  const est = usuarios.filter(u=>u.rol==='estudiante').length;
  const tut = usuarios.filter(u=>u.rol==='tutor').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><i class="fa-solid fa-users"></i><div class="value">${usuarios.length}</div><div class="label">Usuarios totales</div></div>
    <div class="stat"><i class="fa-solid fa-user-graduate"></i><div class="value">${est}</div><div class="label">Estudiantes</div></div>
    <div class="stat"><i class="fa-solid fa-user-tie"></i><div class="value">${tut}</div><div class="label">Tutores</div></div>
    <div class="stat"><i class="fa-solid fa-clipboard-check"></i><div class="value">—</div><div class="label">Exámenes</div></div>`;
}

function renderTabla() {
  const q = document.getElementById('buscar').value.toLowerCase();
  const rol = document.getElementById('filtroRol').value;
  const lista = usuarios.filter(u => {
    const txt = (u.nombres + ' ' + u.apellidos + ' ' + u.email).toLowerCase();
    return (!q || txt.includes(q)) && (!rol || u.rol === rol);
  });
  document.getElementById('tablaUsuarios').innerHTML = lista.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.nombres} ${u.apellidos}</td>
      <td>${u.email}</td>
      <td>${u.numero_documento}</td>
      <td>
        <select onchange="cambiarRol(${u.id}, this.value)" style="padding:6px;border-radius:6px;border:1px solid var(--erto-border)">
          <option value="estudiante" ${u.rol==='estudiante'?'selected':''}>Estudiante</option>
          <option value="tutor" ${u.rol==='tutor'?'selected':''}>Tutor</option>
          <option value="admin" ${u.rol==='admin'?'selected':''}>Admin</option>
        </select>
      </td>
      <td><span class="badge badge-${String(u.activo).toUpperCase()==='SI'?'success':'danger'}">${u.activo}</span></td>
      <td>
        <button class="btn btn-${String(u.activo).toUpperCase()==='SI'?'danger':'success'} btn-sm" onclick="toggle(${u.id})">
          <i class="fa-solid fa-power-off"></i> ${String(u.activo).toUpperCase()==='SI'?'Desactivar':'Activar'}
        </button>
      </td>
    </tr>`).join('');
}

async function cambiarRol(id, rol) {
  const r = await API.cambiarRol(id, rol);
  if (r.success) alerta('Rol actualizado','success');
  else alerta(r.message || 'Error','error');
}
async function toggle(id) {
  const r = await API.toggleActivo(id);
  if (r.success) { alerta('Estado actualizado','success'); setTimeout(()=>location.reload(),700); }
  else alerta(r.message || 'Error','error');
}
</script>
</body>
</html>
