<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sala Virtual · Punke Network</title>
    <!-- Jitsi Meet externo -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <!-- Librerías para certificado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           VARIABLES Y RESET
           ========================================================= */
        :root {
            --primary: #0200AF;
            --primary-light: #3d3be8;
            --primary-dark: #01007a;
            --secondary: #f0f2ff;
            --bg: #f5f7fc;
            --text: #1a1a2e;
            --text-light: #555570;
            --card-bg: #ffffff;
            --shadow: 0 8px 30px rgba(2, 0, 175, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --sidebar-width: 240px;
            --transition: 0.3s ease;
            --font: 'Inter', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            height: 100vh;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================================================
           LOGIN
           ========================================================= */
        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 20px;
        }
        #loginScreen .login-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 36px 28px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        #loginScreen .login-box img {
            max-height: 60px;
            margin-bottom: 12px;
        }
        #loginScreen .login-box h2 {
            font-size: 22px;
            color: var(--primary);
            margin-bottom: 4px;
        }
        #loginScreen .login-box p {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 20px;
        }
        #loginScreen .login-box .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        #loginScreen .login-box .form-group label {
            font-weight: 500;
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }
        #loginScreen .login-box .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: #fafbff;
        }
        #loginScreen .login-box .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(2, 0, 175, 0.08);
        }
        #loginScreen .login-box .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #loginScreen .login-box .btn-login:hover {
            background: var(--primary-dark);
        }
        #loginScreen .login-box .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid #e9ecf5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar .brand {
            padding: 20px 18px 14px;
            border-bottom: 1px solid #e9ecf5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .brand img {
            height: 36px;
        }
        .sidebar .brand span {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }
        .sidebar .brand small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            color: var(--text-light);
        }
        .sidebar .user-info {
            padding: 12px 18px;
            border-bottom: 1px solid #e9ecf5;
            font-size: 14px;
            color: var(--text-light);
        }
        .sidebar .user-info strong {
            color: var(--text);
        }
        .sidebar .nav {
            flex: 1;
            padding: 12px 0;
        }
        .sidebar .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 15px;
            transition: 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar .nav a:hover {
            background: var(--secondary);
            color: var(--primary);
        }
        .sidebar .nav a.active {
            background: var(--secondary);
            color: var(--primary);
            border-left-color: var(--primary);
        }
        .sidebar .nav a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .sidebar .logout-btn {
            padding: 14px 20px;
            border-top: 1px solid #e9ecf5;
            color: #e74c3c;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }
        .sidebar .logout-btn:hover {
            background: #fde8e8;
        }

        /* =========================================================
           MAIN CONTENT
           ========================================================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .main .topbar {
            background: var(--card-bg);
            padding: 10px 20px;
            border-bottom: 1px solid #e9ecf5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .main .topbar .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text);
        }
        .main .topbar .page-title {
            font-weight: 600;
            font-size: 18px;
        }
        .main .topbar .right-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 14px;
            color: var(--text-light);
        }
        .main .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
        }

        /* =========================================================
           PÁGINAS
           ========================================================= */
        .page {
            display: none;
            animation: fadeIn 0.3s;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid rgba(2, 0, 175, 0.04);
        }
        .card h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .card .sub {
            color: var(--text-light);
            font-size: 14px;
        }

        /* =========================================================
           SALA JITSI
           ========================================================= */
        #jitsi-container {
            width: 100%;
            height: 500px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #1a1a2e;
        }
        #jitsi-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* =========================================================
           CURSOS - MÓDULOS
           ========================================================= */
        .modulo {
            background: var(--card-bg);
            border: 1px solid #e9ecf5;
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            overflow: hidden;
            transition: 0.2s;
        }
        .modulo-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafbff;
            transition: 0.2s;
            user-select: none;
        }
        .modulo-header:hover {
            background: #f0f2ff;
        }
        .modulo-header h4 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modulo-header .badge {
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            padding: 1px 10px;
            border-radius: 30px;
        }
        .modulo-header .icon {
            transition: transform 0.3s;
        }
        .modulo-header .icon.open {
            transform: rotate(180deg);
        }
        .modulo-body {
            padding: 0 20px 20px;
            display: none;
        }
        .modulo-body.open {
            display: block;
        }
        .modulo-body .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 12px;
            background: #000;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .modulo-body .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .modulo-body .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .modulo-body .btn-secundario {
            padding: 6px 18px;
            border: 1px solid var(--primary);
            border-radius: 30px;
            background: transparent;
            color: var(--primary);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modulo-body .btn-secundario:hover {
            background: var(--secondary);
        }
        .modulo-body .btn-secundario i {
            margin-right: 4px;
        }
        .modulo-body .btn-siguiente {
            padding: 8px 24px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modulo-body .btn-siguiente:hover {
            background: var(--primary-dark);
        }
        .modulo-body .btn-siguiente:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* módulo bloqueado */
        .modulo-bloqueado .modulo-header {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        .modulo-bloqueado .modulo-header:hover {
            background: #f5f5f5;
        }
        .modulo-bloqueado .modulo-header .badge {
            background: #999;
        }
        .modulo-bloqueado .modulo-header .candado {
            color: #999;
            margin-left: 6px;
        }
        .modulo-bloqueado .modulo-body {
            display: none !important;
        }

        /* =========================================================
           EXAMEN FINAL
           ========================================================= */
        #examenSection {
            display: none;
            margin-top: 30px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 24px;
            border: 1px solid #e9ecf5;
        }
        #examenSection h3 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 4px;
        }
        #examenSection .sub {
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .campos-eval {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }
        .campos-eval .full {
            grid-column: 1 / -1;
        }
        .campos-eval label {
            font-weight: 500;
            font-size: 14px;
            display: block;
            margin-bottom: 2px;
        }
        .campos-eval input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: #fafbff;
        }
        .campos-eval input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(2, 0, 175, 0.08);
        }
        .pregunta-eval {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .pregunta-eval p {
            font-weight: 500;
            margin-bottom: 6px;
        }
        .pregunta-eval label {
            display: block;
            font-weight: 400;
            font-size: 15px;
            padding-left: 8px;
            cursor: pointer;
        }
        .pregunta-eval label input {
            margin-right: 8px;
        }
        .btn-evaluar {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-evaluar:hover {
            background: var(--primary-dark);
        }
        #resultadoEval {
            margin-top: 16px;
            padding: 14px;
            border-radius: var(--radius-sm);
            display: none;
        }
        #resultadoEval.aprobado {
            background: #e6f9ed;
            border: 1px solid #2ecc71;
            display: block;
        }
        #resultadoEval.reprobado {
            background: #fde8e8;
            border: 1px solid #e74c3c;
            display: block;
        }

        /* =========================================================
           CERTIFICADO
           ========================================================= */
        #certificadoSection {
            display: none;
            margin-top: 30px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-align: center;
            border: 1px solid #e9ecf5;
        }
        #certificadoPreview {
            border: 2px solid #eaeaea;
            border-radius: 16px;
            padding: 30px 20px;
            background: #fafbff;
            max-width: 700px;
            margin: 0 auto 20px;
            font-family: var(--font);
        }
        .cert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cert-header img {
            height: 50px;
        }
        .cert-titulo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .cert-sub {
            font-size: 16px;
            color: #555;
        }
        .cert-nombre {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            margin: 12px 0 4px;
        }
        .cert-doc {
            font-size: 15px;
            color: #666;
        }
        .cert-curso {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin: 8px 0;
        }
        .cert-fecha {
            font-size: 14px;
            color: #888;
        }
        .cert-codigo {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
            font-family: monospace;
        }
        .cert-footer {
            margin-top: 14px;
            font-size: 13px;
            color: #888;
            border-top: 1px solid #ddd;
            padding-top: 12px;
        }
        .cert-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }
        .cert-actions .btn-cert {
            padding: 10px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cert.png {
            background: var(--primary);
            color: #fff;
        }
        .btn-cert.png:hover {
            background: var(--primary-dark);
        }
        .btn-cert.pdf {
            background: #e74c3c;
            color: #fff;
        }
        .btn-cert.pdf:hover {
            background: #c0392b;
        }
        .btn-cert.linkedin {
            background: #0077b5;
            color: #fff;
        }
        .btn-cert.linkedin:hover {
            background: #005e8a;
        }
        .btn-cert.finalizar {
            background: #2ecc71;
            color: #fff;
        }
        .btn-cert.finalizar:hover {
            background: #27ae60;
        }

        /* =========================================================
           ADMIN - TABLA USUARIOS Y EXCEL
           ========================================================= */
        .table-wrap {
            overflow-x: auto;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table-wrap table th {
            background: var(--secondary);
            text-align: left;
            padding: 8px 12px;
            font-weight: 600;
        }
        .table-wrap table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .badge-role {
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-role.admin {
            background: #e74c3c;
            color: #fff;
        }
        .badge-role.tutor {
            background: #f39c12;
            color: #fff;
        }
        .badge-role.estudiante {
            background: #2ecc71;
            color: #fff;
        }
        .excel-container {
            margin-top: 12px;
            border: 1px solid #e9ecf5;
            border-radius: var(--radius-sm);
            overflow: hidden;
            height: 400px;
        }
        .excel-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                width: 260px;
                z-index: 200;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main .topbar .hamburger {
                display: block;
            }
            .campos-eval {
                grid-template-columns: 1fr;
            }
            #jitsi-container {
                height: 350px;
            }
            .cert-header img {
                height: 36px;
            }
            .cert-titulo {
                font-size: 22px;
            }
            .cert-actions .btn-cert {
                width: 100%;
                justify-content: center;
            }
        }
        @media (max-width: 480px) {
            #jitsi-container {
                height: 280px;
            }
            .card {
                padding: 16px;
            }
        }

        /* overlay móvil */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 150;
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* bloqueo inspección */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- ==================== LOGIN ==================== -->
    <div id="loginScreen">
        <div class="login-box">
            <img src="img/logo/punke-network.png" alt="Punke Network">
            <h2>Sala Virtual · ERTO</h2>
            <p>Punke Network · Investigación &amp; Consultoría</p>
            <div id="loginError" class="error">Usuario o contraseña incorrectos.</div>
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="loginUser" placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPass" placeholder="Ingresa tu contraseña">
            </div>
            <button class="btn-login" id="btnLogin">Ingresar</button>
            <div style="margin-top:12px; font-size:12px; color:#888;">
                Usuarios: admin / tutor / estudiante · Pass: 123456
            </div>
        </div>
    </div>

    <!-- ==================== SIDEBAR ==================== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="brand">
            <img src="img/logo/punke-network.png" alt="Punke Network">
            <div>
                <span>ERTO</span>
                <small>Sala Virtual</small>
            </div>
        </div>
        <div class="user-info" id="sidebarUser">
            <i class="fas fa-user-circle"></i> <strong id="sidebarName">Usuario</strong>
            <div style="font-size:12px; margin-top:2px;" id="sidebarRole">Rol</div>
        </div>
        <nav class="nav" id="sidebarNav"></nav>
        <div class="logout-btn" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</div>
    </div>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
        <div class="topbar">
            <button class="hamburger" id="btnHamburger"><i class="fas fa-bars"></i></button>
            <span class="page-title" id="pageTitle">Dashboard</span>
            <div class="right-actions">
                <span><i class="fas fa-circle" style="color:#2ecc71;font-size:10px;"></i> Conectado</span>
            </div>
        </div>
        <div class="content" id="mainContent"></div>
    </div>

    <!-- =========================================================
    JAVASCRIPT
    ========================================================= -->
    <script>
        // =========================================================
        // 1. BLOQUEO DE INSPECCIÓN
        // =========================================================
        document.addEventListener('contextmenu', e => { e.preventDefault();
            alert('Inspección deshabilitada.'); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key ===
                    'U')) {
                e.preventDefault();
                alert('Acción no permitida.');
                return false;
            }
        });
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());

        // =========================================================

        function initModulos() {
            // Acordeón
            document.querySelectorAll('.modulo-header').forEach(header => {
                header.addEventListener('click', function() {
                    const targetId = this.dataset.target;
                    const body = document.getElementById(targetId);
                    const icon = this.querySelector('.icon');
                    if (body && !this.closest('.modulo-bloqueado')) {
                        body.classList.toggle('open');
                        if (icon) icon.classList.toggle('open');
                    }
                });
            });

            // Botones "Siguiente módulo"
            document.querySelectorAll('.btn-siguiente').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const siguiente = this.dataset.siguiente;
                    if (siguiente === 'examen') {
                        // Mostrar examen
                        document.getElementById('examenSection').style.display = 'block';
                        document.getElementById('examenSection').scrollIntoView({ behavior: 'smooth' });
                        // Cerrar todos los módulos
                        document.querySelectorAll('.modulo-body').forEach(b => b.classList.remove('open'));
                        document.querySelectorAll('.modulo-header .icon').forEach(i => i.classList.remove(
                        'open'));
                    } else {
                        const targetMod = document.querySelector(`.modulo[data-modulo="${siguiente}"]`);
                        if (targetMod && !targetMod.dataset.bloqueado === 'true') {
                            const body = targetMod.querySelector('.modulo-body');
                            const icon = targetMod.querySelector('.icon');
                            document.querySelectorAll('.modulo-body').forEach(b => b.classList.remove('open'));
                            document.querySelectorAll('.modulo-header .icon').forEach(i => i.classList.remove(
                            'open'));
                            if (body) body.classList.add('open');
                            if (icon) icon.classList.add('open');
                            targetMod.scrollIntoView({ behavior: 'smooth' });
                        } else {
                            alert('Este módulo está bloqueado. Completa el anterior primero.');
                        }
                    }
                });
            });

            // Abrir primer módulo si no está bloqueado
            const primerModulo = document.querySelector('.modulo:not(.modulo-bloqueado)');
            if (primerModulo) {
                const body = primerModulo.querySelector('.modulo-body');
                const icon = primerModulo.querySelector('.icon');
                if (body) body.classList.add('open');
                if (icon) icon.classList.add('open');
            }
        }

        function abrirEmergente(url) {

        // =========================================================
        // 12. EXAMEN
        // =========================================================
        function cargarPreguntasExamen() {
            const container = document.getElementById('preguntasEval');
            container.innerHTML = '';
            respuestasExamen = new Array(CURSO_DATA.preguntasExamen.length).fill(null);
            CURSO_DATA.preguntasExamen.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'pregunta-eval';
                div.innerHTML = `<p>${idx+1}. ${p.pregunta}</p>`;
                p.opciones.forEach((opc, j) => {
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `eval${idx}`;
                    input.value = j;
                    input.addEventListener('change', function() {
                        respuestasExamen[idx] = parseInt(this.value);
                    });
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(' ' + opc));
                    div.appendChild(label);
                });
                container.appendChild(div);
            });
        }

        function calificarExamen() {
            const n1 = document.getElementById('evNombre1').value.trim();
            const n2 = document.getElementById('evNombre2').value.trim();
            const a1 = document.getElementById('evApellido1').value.trim();
            const a2 = document.getElementById('evApellido2').value.trim();
            const cedula = document.getElementById('evCedula').value.trim();

            if (!n1 || !a1 || !a2 || !cedula) {
                alert('Completa todos los campos obligatorios (*).');
                return;
            }

            const todasRespondidas = respuestasExamen.every(r => r !== null);
            if (!todasRespondidas) {
                alert('Responde todas las preguntas.');
                return;
            }

            let aciertos = 0;
            CURSO_DATA.preguntasExamen.forEach((p, idx) => {
                if (respuestasExamen[idx] === p.correcta) aciertos++;
            });

            const resultadoDiv = document.getElementById('resultadoEval');
            resultadoDiv.style.display = 'block';
            resultadoDiv.className = '';

            const porcentaje = Math.round((aciertos / CURSO_DATA.preguntasExamen.length) * 100);

            if (aciertos >= 7) { // 90% = 7 de 8
                resultadoDiv.className = 'aprobado';
                resultadoDiv.innerHTML =
                    `<strong>✅ ¡Aprobado!</strong> ${aciertos} de ${CURSO_DATA.preguntasExamen.length} correctas (${porcentaje}%). Generando certificado...`;
                generarCertificado(n1, n2, a1, a2, cedula);
                document.getElementById('certificadoSection').style.display = 'block';
                document.getElementById('certificadoSection').scrollIntoView({ behavior: 'smooth' });
            } else {
                resultadoDiv.className = 'reprobado';
                resultadoDiv.innerHTML =
                    `<strong>❌ No aprobado.</strong> ${aciertos} de ${CURSO_DATA.preguntasExamen.length} correctas (${porcentaje}%). Necesitas al menos 7 correctas (90%).`;
                document.getElementById('certificadoSection').style.display = 'none';
            }
        }

        // =========================================================
        // 13. CERTIFICADO
        // =========================================================
        function generarCertificado(n1, n2, a1, a2, cedula) {
            const nombreCompleto = `${n1} ${n2} ${a1} ${a2}`;
            document.getElementById('certNombre').textContent = nombreCompleto;
            document.getElementById('certDoc').textContent = `C.C. ${cedula}`;
            document.getElementById('certCurso').textContent = `Curso: ${CURSO_DATA.titulo}`;

            const hoy = new Date();
            const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('certFecha').textContent = `Fecha: ${hoy.toLocaleDateString('es-ES', opciones)}`;

            const codigo = 'ERT-' + hoy.getFullYear() + '-' + String(Math.floor(1000 + Math.random() * 9000));
            document.getElementById('certCodigo').textContent = `Código: ${codigo}`;
            certificadoGenerado = true;
        }

        function descargarPNG() {
            if (!certificadoGenerado) { alert('Primero aprueba el examen.'); return; }
            const preview = document.getElementById('certificadoPreview');
            html2canvas(preview, { scale: 2, backgroundColor: '#fafbff', allowTaint: false, useCORS: true, logging: false })
                .then(canvas => {
                    const link = document.createElement('a');
                    link.download =
                        `certificado-${document.getElementById('certCodigo').textContent.replace('Código: ', '')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
        }

        function descargarPDF() {
            if (!certificadoGenerado) { alert('Primero aprueba el examen.'); return; }
            const preview = document.getElementById('certificadoPreview');
            html2canvas(preview, { scale: 2, backgroundColor: '#fafbff', allowTaint: false, useCORS: true, logging: false })
                .then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                    pdf.save(
                        `certificado-${document.getElementById('certCodigo').textContent.replace('Código: ', '')}.pdf`);
                });
        }
